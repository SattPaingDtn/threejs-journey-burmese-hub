<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Journey - Burmese Learning Hub & Interactive Studio</title>
    <meta name="description" content="Three.js Journey Complete Course Study Guide, Interactive 3D Labs & Memos in Burmese">

    <!-- Marked.js for Markdown & Highlight.js for Syntax Highlighting -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark-dimmed.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        :root {
            --bg-dark: #0c0d12;
            --bg-panel: #13141c;
            --bg-card: #181a24;
            --border-color: #232635;
            --accent: #705df2;
            --accent-light: #8e7ff7;
            --accent-gradient: linear-gradient(135deg, #705df2 0%, #a855f7 100%);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Top Header */
        header.top-bar {
            height: 58px;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 18px;
            z-index: 100;
        }

        .brand-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-menu-toggle {
            display: none;
            background: #202330;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
        }

        .logo-text {
            font-weight: 800;
            font-size: 1.05rem;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-text span.hub-badge {
            background: var(--accent-gradient);
            color: #fff;
            font-size: 0.68rem;
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .view-switcher {
            display: flex;
            background: #1c1e2a;
            padding: 3px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .view-tab {
            padding: 6px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--text-muted);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            user-select: none;
        }

        .view-tab:hover {
            color: #fff;
        }

        .view-tab.active {
            background: var(--accent);
            color: #fff;
            font-weight: 600;
            box-shadow: 0 2px 10px rgba(112, 93, 242, 0.4);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .search-box {
            position: relative;
        }

        .search-input {
            background: #1a1c26;
            border: 1px solid var(--border-color);
            color: #fff;
            font-size: 0.8rem;
            padding: 6px 12px 6px 30px;
            border-radius: 6px;
            outline: none;
            width: 190px;
            transition: width 0.2s;
        }

        .search-input:focus {
            border-color: var(--accent);
            width: 240px;
        }

        .search-icon {
            position: absolute;
            left: 9px;
            top: 7px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* Layout Container */
        .app-body {
            flex: 1;
            display: flex;
            position: relative;
            overflow: hidden;
        }

        /* Left Sidebar (Lesson Directory) */
        aside.lesson-sidebar {
            width: 320px;
            background: var(--bg-panel);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            flex-shrink: 0;
            transition: transform 0.3s ease;
            z-index: 50;
        }

        aside.lesson-sidebar::-webkit-scrollbar {
            width: 5px;
        }
        aside.lesson-sidebar::-webkit-scrollbar-thumb {
            background: #252838;
            border-radius: 4px;
        }

        .chapter-group {
            border-bottom: 1px solid var(--border-color);
        }

        .chapter-title {
            padding: 12px 16px 8px 16px;
            font-size: 0.76rem;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: #ffb74d;
            font-weight: 700;
            background: #101118;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .lesson-item {
            padding: 10px 16px;
            cursor: pointer;
            border-left: 3px solid transparent;
            transition: all 0.15s;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .lesson-item:hover {
            background: #181a24;
        }

        .lesson-item.active {
            background: #1f212e;
            border-left-color: var(--accent);
        }

        .lesson-item-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .lesson-number-title {
            font-size: 0.84rem;
            font-weight: 600;
            color: #f1f5f9;
        }

        .lesson-item.active .lesson-number-title {
            color: var(--accent-light);
        }

        .badge-status {
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
        }
        .badge-ready { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.4); }
        .badge-upcoming { background: rgba(100, 116, 139, 0.2); color: #94a3b8; }

        .lesson-item-sub {
            font-size: 0.74rem;
            color: var(--text-muted);
            line-height: 1.35;
        }

        /* Main Workspace Area */
        main.workspace-area {
            flex: 1;
            position: relative;
            height: 100%;
            overflow: hidden;
            display: flex;
        }

        /* VIEW 1: Markdown Reader View */
        #view-guide {
            width: 100%;
            height: 100%;
            overflow-y: auto;
            background: var(--bg-dark);
            padding: 30px 20px;
            display: block;
        }

        .guide-paper {
            max-width: 880px;
            margin: 0 auto;
            background: var(--bg-card);
            padding: 40px 45px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            line-height: 1.75;
        }

        .guide-paper h1 { font-size: 1.8rem; color: #a79afc; margin-bottom: 16px; border-bottom: 2px solid var(--accent); padding-bottom: 8px; }
        .guide-paper h2 { font-size: 1.35rem; color: #ffb74d; margin-top: 30px; margin-bottom: 12px; border-bottom: 1px solid var(--border-color); padding-bottom: 6px; }
        .guide-paper h3 { font-size: 1.1rem; color: #64d2ff; margin-top: 22px; margin-bottom: 8px; }
        .guide-paper h4 { font-size: 0.95rem; color: #f472b6; margin-top: 14px; margin-bottom: 6px; }
        .guide-paper p { margin-bottom: 14px; color: #cbd5e1; font-size: 0.93rem; }
        .guide-paper ul, .guide-paper ol { margin-left: 24px; margin-bottom: 16px; color: #cbd5e1; font-size: 0.91rem; }
        .guide-paper li { margin-bottom: 6px; }
        .guide-paper blockquote { border-left: 4px solid var(--accent); background: #111219; padding: 12px 16px; border-radius: 6px; margin-bottom: 18px; color: #94a3b8; font-size: 0.88rem; }
        .guide-paper table { width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 0.86rem; }
        .guide-paper th, .guide-paper td { border: 1px solid var(--border-color); padding: 10px 12px; text-align: left; }
        .guide-paper th { background: #1f222e; color: #ffb74d; }
        .guide-paper tr:nth-child(even) { background: #12131b; }
        .guide-paper pre { background: #0a0b0f !important; border: 1px solid var(--border-color); border-radius: 8px; padding: 14px; overflow-x: auto; margin-bottom: 18px; font-size: 0.82rem; }
        .guide-paper code:not(pre code) { background: #262938; color: #ff94c2; padding: 2px 6px; border-radius: 4px; font-size: 0.82rem; }
        .guide-paper a { color: #8b7cf8; text-decoration: none; }
        .guide-paper a:hover { text-decoration: underline; }

        /* VIEW 2: 3D Interactive Lab View */
        #view-lab {
            width: 100%;
            height: 100%;
            display: none;
            position: relative;
        }

        #lab-canvas-container {
            flex: 1;
            position: relative;
            height: 100%;
            overflow: hidden;
            background: #090a0f;
        }

        canvas.lab-webgl {
            width: 100% !important;
            height: 100% !important;
            display: block;
        }

        #lab-sidebar {
            width: 390px;
            background: var(--bg-panel);
            border-left: 1px solid var(--border-color);
            padding: 18px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
            z-index: 10;
        }

        #lab-sidebar::-webkit-scrollbar {
            width: 5px;
        }
        #lab-sidebar::-webkit-scrollbar-thumb {
            background: #282b3a;
            border-radius: 4px;
        }

        .lab-card {
            background: var(--bg-card);
            border-radius: 8px;
            padding: 14px;
            border: 1px solid var(--border-color);
        }

        .lab-card h2 {
            font-size: 0.9rem;
            color: #ffb74d;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .lab-control-group {
            margin-bottom: 12px;
        }

        .lab-control-group:last-child {
            margin-bottom: 0;
        }

        .lab-control-group label {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #d1d5db;
            margin-bottom: 4px;
        }

        .lab-control-group label span.val {
            color: #64d2ff;
            font-family: monospace;
            font-weight: bold;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .btn-group {
            display: flex;
            gap: 6px;
        }

        button.btn-lab {
            flex: 1;
            padding: 8px 10px;
            background: #222430;
            color: #cbd5e1;
            border: 1px solid #333748;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.78rem;
            transition: all 0.2s;
        }

        button.btn-lab:hover { background: #2d3040; }
        button.btn-lab.active {
            background: var(--accent);
            border-color: var(--accent-light);
            color: #fff;
            font-weight: 600;
        }

        .lab-info-box {
            font-size: 0.76rem;
            line-height: 1.5;
            color: #cbd5e1;
            background: #0f1015;
            padding: 10px 12px;
            border-radius: 6px;
            border-left: 3px solid var(--accent);
        }

        .lab-code-box {
            background: #08090d;
            border: 1px solid #1e212d;
            border-radius: 6px;
            padding: 10px;
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
            font-size: 0.72rem;
            color: #4ade80;
            overflow-x: auto;
            white-space: pre-wrap;
            line-height: 1.4;
        }

        #lab-stats {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(15, 16, 22, 0.88);
            backdrop-filter: blur(8px);
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            font-size: 0.76rem;
            font-family: monospace;
            color: #94a3b8;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 3px;
            z-index: 10;
        }

        #lab-stats span {
            color: #38ef7d;
            font-weight: bold;
        }

        /* Mobile Responsive */
        @media (max-width: 900px) {
            .btn-menu-toggle { display: block; }
            aside.lesson-sidebar {
                position: absolute;
                top: 0;
                bottom: 0;
                left: 0;
                transform: translateX(-100%);
                box-shadow: 10px 0 30px rgba(0,0,0,0.8);
            }
            aside.lesson-sidebar.open {
                transform: translateX(0);
            }
            .search-input { width: 140px; }
            .search-input:focus { width: 160px; }
            #lab-sidebar { width: 100%; position: absolute; bottom: 0; height: 280px; }
            .guide-paper { padding: 25px 20px; }
        }
    </style>
</head>
<body>

    <!-- Top Navigation -->
    <header class="top-bar">
        <div class="brand-group">
            <button class="btn-menu-toggle" id="btn-toggle-sidebar" aria-label="Toggle Menu">☰</button>
            <div class="logo-text">
                <span>Three.js Journey</span>
                <span class="hub-badge">Burmese Hub</span>
            </div>
        </div>

        <div class="view-switcher">
            <div id="tab-btn-guide" class="view-tab active">
                <span>📚 သင်ခန်းစာ လမ်းညွှန် & Memo</span>
            </div>
            <div id="tab-btn-lab" class="view-tab">
                <span>🎮 Interactive 3D Lab</span>
            </div>
        </div>

        <div class="header-actions">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="search-input" class="search-input" placeholder="Search lessons..." />
            </div>
            <a href="https://threejs-journey.com" target="_blank" class="view-tab" style="padding:6px 10px; border:1px solid var(--border-color); text-decoration:none;">
                <span>Official Course</span> ↗
            </a>
        </div>
    </header>

    <!-- Main App Body -->
    <div class="app-body">

        <!-- Lesson Sidebar / Drawer -->
        <aside class="lesson-sidebar" id="lesson-sidebar">
            <div id="lessons-list-container">
                <!-- Dynamically Populated from data/lessons.js -->
            </div>
        </aside>

        <!-- Workspace View (Guide or Lab) -->
        <main class="workspace-area">

            <!-- View 1: Markdown Reader -->
            <section id="view-guide">
                <div class="guide-paper" id="guide-markdown-content">
                    <div style="text-align:center; padding: 50px 0; color: #94a3b8;">
                        Loading lesson content...
                    </div>
                </div>
            </section>

            <!-- View 2: 3D Interactive Lab -->
            <section id="view-lab">
                <div id="lab-canvas-container">
                    <div id="lab-stats">
                        <div>Active Lesson: <span id="stat-lesson-title">Lesson 07: Cameras</span></div>
                        <div>Camera Type: <span id="stat-cam-type">PerspectiveCamera</span></div>
                        <div>Camera Pos: <span id="stat-cam-pos">x: 0, y: 1.5, z: 4</span></div>
                    </div>
                    <canvas class="lab-webgl"></canvas>
                </div>

                <aside id="lab-sidebar">
                    <!-- Dynamic Controls based on active lesson -->
                    <div id="lab-dynamic-panel">
                        <!-- Rendered by JavaScript -->
                    </div>

                    <div class="lab-card">
                        <h2>💻 Live Code Snippet</h2>
                        <div id="lab-live-code" class="lab-code-box">// Three.js Live Code</div>
                    </div>
                </aside>
            </section>

        </main>
    </div>

    <!-- Three.js CDN Module Setup -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <!-- Main Web App Script -->
    <script type="module">
        import { CHAPTERS, LESSONS } from './data/lessons.js'
        import * as THREE from 'three'
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js'

        // State
        let currentLessonId = "07-cameras"
        let currentView = "guide" // "guide" | "lab"

        // DOM Elements
        const lessonsContainer = document.getElementById('lessons-list-container')
        const guideContent = document.getElementById('guide-markdown-content')
        const viewGuide = document.getElementById('view-guide')
        const viewLab = document.getElementById('view-lab')
        const tabBtnGuide = document.getElementById('tab-btn-guide')
        const tabBtnLab = document.getElementById('tab-btn-lab')
        const searchInput = document.getElementById('search-input')
        const sidebar = document.getElementById('lesson-sidebar')
        const btnToggleSidebar = document.getElementById('btn-toggle-sidebar')
        const labDynamicPanel = document.getElementById('lab-dynamic-panel')
        const labLiveCode = document.getElementById('lab-live-code')
        const statLessonTitle = document.getElementById('stat-lesson-title')
        const statCamType = document.getElementById('stat-cam-type')
        const statCamPos = document.getElementById('stat-cam-pos')

        // ==========================================
        // 3D Scene Initialization
        // ==========================================
        const labContainer = document.getElementById('lab-canvas-container')
        const labCanvas = document.querySelector('canvas.lab-webgl')
        const labScene = new THREE.Scene()
        labScene.background = new THREE.Color('#0c0d12')

        // Helpers
        const gridHelper = new THREE.GridHelper(14, 28, 0x705df2, 0x232635)
        gridHelper.position.y = -0.5
        labScene.add(gridHelper)

        const axesHelper = new THREE.AxesHelper(2)
        labScene.add(axesHelper)

        // Center Object (Normal Box)
        const centerCube = new THREE.Mesh(
            new THREE.BoxGeometry(1, 1, 1),
            new THREE.MeshNormalMaterial()
        )
        labScene.add(centerCube)

        // Surrounding Reference Objects
        const createReferenceMesh = (geom, color, x, y, z) => {
            const mesh = new THREE.Mesh(geom, new THREE.MeshBasicMaterial({ color }))
            mesh.position.set(x, y, z)
            labScene.add(mesh)
            return mesh
        }

        const surroundingMeshes = [
            createReferenceMesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), 0xff5252, -2.5, 0, -2.5),
            createReferenceMesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), 0x448aff, 2.5, 0, -2.5),
            createReferenceMesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), 0x69f0ae, -2.5, 0, 2.5),
            createReferenceMesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), 0xffd740, 2.5, 0, 2.5),
            createReferenceMesh(new THREE.SphereGeometry(0.4, 16, 16), 0xe040fb, 0, 2.2, 0),
            createReferenceMesh(new THREE.SphereGeometry(0.4, 16, 16), 0x00e5ff, 0, 0, -5)
        ]

        // Cameras Setup
        let labAspect = 1.333
        const perspCam = new THREE.PerspectiveCamera(75, labAspect, 0.1, 100)
        perspCam.position.set(0, 1.5, 4)
        labScene.add(perspCam)

        const frustumSize = 4.5
        const orthoCam = new THREE.OrthographicCamera(
            -frustumSize * labAspect / 2,
             frustumSize * labAspect / 2,
             frustumSize / 2,
            -frustumSize / 2,
             0.1,
             100
        )
        orthoCam.position.set(0, 1.5, 4)
        labScene.add(orthoCam)

        let activeCam = perspCam

        // OrbitControls Setup
        const labControls = new OrbitControls(perspCam, labCanvas)
        labControls.enableDamping = true
        labControls.dampingFactor = 0.05
        labControls.target.set(0, 0, 0)

        // WebGLRenderer Setup
        const labRenderer = new THREE.WebGLRenderer({ canvas: labCanvas, antialias: true })
        labRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2))

        // Resize Logic
        const triggerLabResize = () => {
            const width = labContainer.clientWidth || window.innerWidth - 390 - 320
            const height = labContainer.clientHeight || window.innerHeight - 58
            if (width <= 0 || height <= 0) return

            labAspect = width / height

            perspCam.aspect = labAspect
            perspCam.updateProjectionMatrix()

            orthoCam.left = -frustumSize * labAspect / 2
            orthoCam.right = frustumSize * labAspect / 2
            orthoCam.top = frustumSize / 2
            orthoCam.bottom = -frustumSize / 2
            orthoCam.updateProjectionMatrix()

            labRenderer.setSize(width, height)
        }

        window.addEventListener('resize', triggerLabResize)

        // Mouse Position for Custom Control
        let labControlMode = 'orbit' // 'orbit' | 'custom' | 'lerp'
        const cursor = { x: 0, y: 0 }
        const targetPos = new THREE.Vector3()

        window.addEventListener('mousemove', (e) => {
            const rect = labCanvas.getBoundingClientRect()
            if (
                e.clientX >= rect.left && e.clientX <= rect.right &&
                e.clientY >= rect.top && e.clientY <= rect.bottom
            ) {
                cursor.x = (e.clientX - rect.left) / rect.width - 0.5
                cursor.y = -((e.clientY - rect.top) / rect.height - 0.5)
            }
        })

        // ==========================================
        // Dynamic Lab Controls by Lesson
        // ==========================================
        const setupLabControls = (lessonId) => {
            statLessonTitle.innerText = `${lessonId.toUpperCase()}`

            if (lessonId === '07-cameras') {
                labDynamicPanel.innerHTML = `
                    <div class="lab-card">
                        <h2>🎥 ကင်မရာ အမျိုးအစား (Camera Type)</h2>
                        <div class="btn-group">
                            <button id="btn-cam-persp" class="btn-lab ${activeCam === perspCam ? 'active' : ''}">Perspective</button>
                            <button id="btn-cam-ortho" class="btn-lab ${activeCam === orthoCam ? 'active' : ''}">Orthographic</button>
                        </div>
                        <div id="lab-cam-desc" class="lab-info-box" style="margin-top:10px;">
                            <strong>PerspectiveCamera:</strong> လူ့မျက်လုံးလို အနီးရှိအရာများ ကြီးပြီး အဝေးရှိအရာများ သေးငယ်သွားသော သဘာဝကျသည့် ကင်မရာ။
                        </div>
                    </div>

                    <div id="lab-persp-params" class="lab-card" style="opacity: ${activeCam === perspCam ? '1' : '0.45'}; pointer-events: ${activeCam === perspCam ? 'auto' : 'none'};">
                        <h2>⚙️ Perspective Parameters</h2>
                        <div class="lab-control-group">
                            <label>FOV (Field of View): <span id="val-fov" class="val">${perspCam.fov}°</span></label>
                            <input type="range" id="param-fov" min="15" max="120" value="${perspCam.fov}">
                        </div>
                        <div class="lab-control-group">
                            <label>Near Clipping Plane: <span id="val-near" class="val">${perspCam.near}</span></label>
                            <input type="range" id="param-near" min="0.05" max="3" step="0.05" value="${perspCam.near}">
                        </div>
                        <div class="lab-control-group">
                            <label>Far Clipping Plane: <span id="val-far" class="val">${perspCam.far}</span></label>
                            <input type="range" id="param-far" min="2" max="100" step="1" value="${perspCam.far}">
                        </div>
                    </div>

                    <div class="lab-card">
                        <h2>🕹️ Camera Control Modes</h2>
                        <div class="btn-group" style="margin-bottom:10px;">
                            <button id="btn-mode-orbit" class="btn-lab ${labControlMode === 'orbit' ? 'active' : ''}">OrbitControls</button>
                            <button id="btn-mode-custom" class="btn-lab ${labControlMode === 'custom' ? 'active' : ''}">Trig (sin/cos)</button>
                            <button id="btn-mode-lerp" class="btn-lab ${labControlMode === 'lerp' ? 'active' : ''}">Smooth Lerp</button>
                        </div>
                        <div class="lab-control-group">
                            <label>
                                <span>Enable Damping (အရှိန်ဖြင့် ရပ်ခြင်း)</span>
                                <input type="checkbox" id="chk-damping" ${labControls.enableDamping ? 'checked' : ''}>
                            </label>
                        </div>
                        <div class="lab-control-group">
                            <label>
                                <span>Auto-Rotate (အလိုအလျောက် လှည့်ခြင်း)</span>
                                <input type="checkbox" id="chk-autorotate" ${labControls.autoRotate ? 'checked' : ''}>
                            </label>
                        </div>
                    </div>
                `

                // Bind Camera Events
                const btnPersp = document.getElementById('btn-cam-persp')
                const btnOrtho = document.getElementById('btn-cam-ortho')
                const camDesc = document.getElementById('lab-cam-desc')
                const perspParams = document.getElementById('lab-persp-params')
                const paramFov = document.getElementById('param-fov')
                const valFov = document.getElementById('val-fov')
                const paramNear = document.getElementById('param-near')
                const valNear = document.getElementById('val-near')
                const paramFar = document.getElementById('param-far')
                const valFar = document.getElementById('val-far')
                const btnModeOrbit = document.getElementById('btn-mode-orbit')
                const btnModeCustom = document.getElementById('btn-mode-custom')
                const btnModeLerp = document.getElementById('btn-mode-lerp')
                const chkDamping = document.getElementById('chk-damping')
                const chkAutorotate = document.getElementById('chk-autorotate')

                btnPersp.addEventListener('click', () => {
                    btnPersp.classList.add('active')
                    btnOrtho.classList.remove('active')
                    activeCam = perspCam
                    labControls.object = perspCam
                    perspParams.style.opacity = '1'
                    perspParams.style.pointerEvents = 'auto'
                    camDesc.innerHTML = '<strong>PerspectiveCamera:</strong> လူ့မျက်လုံးလို အနီးရှိအရာများ ကြီးပြီး အဝေးရှိအရာများ သေးငယ်သွားသော သဘာဝကျသည့် ကင်မရာ။'
                    statCamType.innerText = 'PerspectiveCamera'
                    updateLiveCodeText()
                })

                btnOrtho.addEventListener('click', () => {
                    btnOrtho.classList.add('active')
                    btnPersp.classList.remove('active')
                    activeCam = orthoCam
                    labControls.object = orthoCam
                    perspParams.style.opacity = '0.45'
                    perspParams.style.pointerEvents = 'none'
                    camDesc.innerHTML = '<strong>OrthographicCamera:</strong> အကွာအဝေးကြောင့် ပုံမသေးသွားဘဲ မျဉ်းပြိုင် (Parallel Projection) အတိုင်း ပြပေးသည့် ကင်မရာ (2D/Isometric Game များအတွက်)။'
                    statCamType.innerText = 'OrthographicCamera'
                    updateLiveCodeText()
                })

                paramFov.addEventListener('input', (e) => {
                    const v = Number(e.target.value)
                    valFov.innerText = v + '°'
                    perspCam.fov = v
                    perspCam.updateProjectionMatrix()
                    updateLiveCodeText()
                })

                paramNear.addEventListener('input', (e) => {
                    const v = Number(e.target.value)
                    valNear.innerText = v
                    perspCam.near = v
                    orthoCam.near = v
                    perspCam.updateProjectionMatrix()
                    orthoCam.updateProjectionMatrix()
                    updateLiveCodeText()
                })

                paramFar.addEventListener('input', (e) => {
                    const v = Number(e.target.value)
                    valFar.innerText = v
                    perspCam.far = v
                    orthoCam.far = v
                    perspCam.updateProjectionMatrix()
                    orthoCam.updateProjectionMatrix()
                    updateLiveCodeText()
                })

                btnModeOrbit.addEventListener('click', () => {
                    btnModeOrbit.classList.add('active')
                    btnModeCustom.classList.remove('active')
                    btnModeLerp.classList.remove('active')
                    labControlMode = 'orbit'
                    labControls.enabled = true
                    updateLiveCodeText()
                })

                btnModeCustom.addEventListener('click', () => {
                    btnModeCustom.classList.add('active')
                    btnModeOrbit.classList.remove('active')
                    btnModeLerp.classList.remove('active')
                    labControlMode = 'custom'
                    labControls.enabled = false
                    updateLiveCodeText()
                })

                btnModeLerp.addEventListener('click', () => {
                    btnModeLerp.classList.add('active')
                    btnModeOrbit.classList.remove('active')
                    btnModeCustom.classList.remove('active')
                    labControlMode = 'lerp'
                    labControls.enabled = false
                    updateLiveCodeText()
                })

                chkDamping.addEventListener('change', (e) => {
                    labControls.enableDamping = e.target.checked
                    updateLiveCodeText()
                })

                chkAutorotate.addEventListener('change', (e) => {
                    labControls.autoRotate = e.target.checked
                    labControls.autoRotateSpeed = 2.0
                })

            } else if (lessonId === '04-transform-objects') {
                labDynamicPanel.innerHTML = `
                    <div class="lab-card">
                        <h2>📍 Position (Vector3)</h2>
                        <div class="lab-control-group">
                            <label>Position X: <span id="val-pos-x" class="val">${centerCube.position.x.toFixed(1)}</span></label>
                            <input type="range" id="param-pos-x" min="-3" max="3" step="0.1" value="${centerCube.position.x}">
                        </div>
                        <div class="lab-control-group">
                            <label>Position Y: <span id="val-pos-y" class="val">${centerCube.position.y.toFixed(1)}</span></label>
                            <input type="range" id="param-pos-y" min="-2" max="2" step="0.1" value="${centerCube.position.y}">
                        </div>
                    </div>

                    <div class="lab-card">
                        <h2>🔄 Rotation (Euler Angles)</h2>
                        <div class="lab-control-group">
                            <label>Rotation Y: <span id="val-rot-y" class="val">${centerCube.rotation.y.toFixed(2)} rad</span></label>
                            <input type="range" id="param-rot-y" min="0" max="6.28" step="0.1" value="${centerCube.rotation.y}">
                        </div>
                    </div>

                    <div class="lab-card">
                        <h2>🔍 Scale (Vector3)</h2>
                        <div class="lab-control-group">
                            <label>Uniform Scale: <span id="val-scale" class="val">${centerCube.scale.x.toFixed(1)}x</span></label>
                            <input type="range" id="param-scale" min="0.2" max="2.5" step="0.1" value="${centerCube.scale.x}">
                        </div>
                    </div>
                `

                document.getElementById('param-pos-x').addEventListener('input', (e) => {
                    centerCube.position.x = Number(e.target.value)
                    document.getElementById('val-pos-x').innerText = centerCube.position.x.toFixed(1)
                    updateLiveCodeText()
                })
                document.getElementById('param-pos-y').addEventListener('input', (e) => {
                    centerCube.position.y = Number(e.target.value)
                    document.getElementById('val-pos-y').innerText = centerCube.position.y.toFixed(1)
                    updateLiveCodeText()
                })
                document.getElementById('param-rot-y').addEventListener('input', (e) => {
                    centerCube.rotation.y = Number(e.target.value)
                    document.getElementById('val-rot-y').innerText = centerCube.rotation.y.toFixed(2) + ' rad'
                    updateLiveCodeText()
                })
                document.getElementById('param-scale').addEventListener('input', (e) => {
                    const s = Number(e.target.value)
                    centerCube.scale.set(s, s, s)
                    document.getElementById('val-scale').innerText = s.toFixed(1) + 'x'
                    updateLiveCodeText()
                })

            } else {
                // Default Controls for other lessons
                labDynamicPanel.innerHTML = `
                    <div class="lab-card">
                        <h2>🎮 3D Playground</h2>
                        <div class="lab-info-box">
                            Mouse ဖြင့် ဖိဆွဲပြီး 3D Scene ကို ၃၆၀ ဒီဂရီ လှည့်ပတ်ကြည့်ရှုနိုင်ပါသည်။
                        </div>
                        <div class="lab-control-group" style="margin-top:10px;">
                            <label>
                                <span>Auto Rotate Scene</span>
                                <input type="checkbox" id="chk-default-rotate">
                            </label>
                        </div>
                    </div>
                `
                document.getElementById('chk-default-rotate')?.addEventListener('change', (e) => {
                    labControls.autoRotate = e.target.checked
                })
            }

            updateLiveCodeText()
        }

        const updateLiveCodeText = () => {
            if (currentLessonId === '07-cameras') {
                if (activeCam === perspCam) {
                    labLiveCode.innerText = `// PerspectiveCamera Setup
const camera = new THREE.PerspectiveCamera(
  ${perspCam.fov}, // FOV
  sizes.width / sizes.height, // Aspect
  ${perspCam.near}, // Near
  ${perspCam.far} // Far
)
camera.position.set(${activeCam.position.x.toFixed(1)}, ${activeCam.position.y.toFixed(1)}, ${activeCam.position.z.toFixed(1)})

// Controls Setup
const controls = new OrbitControls(camera, canvas)
controls.enableDamping = ${labControls.enableDamping}`
                } else {
                    labLiveCode.innerText = `// OrthographicCamera Setup
const aspect = sizes.width / sizes.height
const camera = new THREE.OrthographicCamera(
  -${(frustumSize * labAspect / 2).toFixed(1)}, // Left (-size * aspect)
   ${(frustumSize * labAspect / 2).toFixed(1)}, // Right (size * aspect)
   ${(frustumSize / 2).toFixed(1)},  // Top
  -${(frustumSize / 2).toFixed(1)},  // Bottom
   ${orthoCam.near}, // Near
   ${orthoCam.far}  // Far
)`
                }
            } else if (currentLessonId === '04-transform-objects') {
                labLiveCode.innerText = `mesh.position.set(${centerCube.position.x.toFixed(1)}, ${centerCube.position.y.toFixed(1)}, ${centerCube.position.z.toFixed(1)})
mesh.rotation.y = ${centerCube.rotation.y.toFixed(2)}
mesh.scale.set(${centerCube.scale.x.toFixed(1)}, ${centerCube.scale.y.toFixed(1)}, ${centerCube.scale.z.toFixed(1)})`
            } else {
                labLiveCode.innerText = `// Basic Scene
const scene = new THREE.Scene()
const camera = new THREE.PerspectiveCamera(75, sizes.width / sizes.height)
camera.position.z = 3
scene.add(camera)`
            }
        }

        // ==========================================
        // Lesson Selection & Markdown Loading
        // ==========================================
        const selectLesson = async (lessonId) => {
            currentLessonId = lessonId
            window.location.hash = lessonId

            // Update active sidebar item
            document.querySelectorAll('.lesson-item').forEach(el => {
                el.classList.toggle('active', el.dataset.id === lessonId)
            })

            const lesson = LESSONS.find(l => l.id === lessonId)
            if (!lesson) return

            // Setup Lab for this lesson
            setupLabControls(lessonId)

            // Load Guide Markdown
            guideContent.innerHTML = '<div style="text-align:center; padding: 40px; color:#94a3b8;">Loading guide...</div>'

            if (lesson.guideFile) {
                try {
                    const res = await fetch(`./${lesson.guideFile}`)
                    if (res.ok) {
                        const md = await res.text()
                        guideContent.innerHTML = marked.parse(md)
                        hljs.highlightAll()
                    } else {
                        guideContent.innerHTML = `<div style="padding:20px;"><h2>${lesson.title}</h2><p style="color:#94a3b8;">ဤသင်ခန်းစာအတွက် Guide ကို မကြာမီ ပြုစုတင်ပြပေးပါမည်။</p></div>`
                    }
                } catch (e) {
                    guideContent.innerHTML = `<div style="padding:20px;"><h2>${lesson.title}</h2><p style="color:#ef4444;">Markdown ဖိုင်ကို ဆွဲယူ၍ မရပါ (Fetch Error)။</p></div>`
                }
            } else {
                guideContent.innerHTML = `
                    <div style="padding:20px;">
                        <h2>${lesson.title}</h2>
                        <p style="color:#ffb74d;">✨ မကြာမီ ပြုစုတင်ပြပေးပါမည် (Upcoming Lesson)</p>
                        <p>${lesson.subtitle}</p>
                    </div>
                `
            }

            viewGuide.scrollTop = 0
        }

        // Render Sidebar
        const renderSidebar = (filterText = "") => {
            lessonsContainer.innerHTML = ""

            CHAPTERS.forEach(chapter => {
                const chapterLessons = LESSONS.filter(l => 
                    l.chapter === chapter.id &&
                    (filterText === "" || 
                     l.title.toLowerCase().includes(filterText.toLowerCase()) || 
                     l.tags.some(t => t.toLowerCase().includes(filterText.toLowerCase())))
                )

                if (chapterLessons.length === 0) return

                const group = document.createElement('div')
                group.className = 'chapter-group'

                const title = document.createElement('div')
                title.className = 'chapter-title'
                title.innerHTML = `<span>${chapter.title}</span> <span>(${chapterLessons.length})</span>`
                group.appendChild(title)

                chapterLessons.forEach(lesson => {
                    const item = document.createElement('div')
                    item.className = `lesson-item ${lesson.id === currentLessonId ? 'active' : ''}`
                    item.dataset.id = lesson.id

                    const isReady = lesson.status === 'ready'
                    item.innerHTML = `
                        <div class="lesson-item-header">
                            <span class="lesson-number-title">${lesson.number}. ${lesson.title}</span>
                            <span class="badge-status ${isReady ? 'badge-ready' : 'badge-upcoming'}">${isReady ? 'Ready' : 'Upcoming'}</span>
                        </div>
                        <div class="lesson-item-sub">${lesson.subtitle}</div>
                    `

                    item.addEventListener('click', () => {
                        selectLesson(lesson.id)
                        if (window.innerWidth <= 900) {
                            sidebar.classList.remove('open')
                        }
                    })

                    group.appendChild(item)
                })

                lessonsContainer.appendChild(group)
            })
        }

        // View Tabs Switching
        tabBtnGuide.addEventListener('click', () => {
            tabBtnGuide.classList.add('active')
            tabBtnLab.classList.remove('active')
            viewGuide.style.display = 'block'
            viewLab.style.display = 'none'
            currentView = "guide"
        })

        tabBtnLab.addEventListener('click', () => {
            tabBtnLab.classList.add('active')
            tabBtnGuide.classList.remove('active')
            viewGuide.style.display = 'none'
            viewLab.style.display = 'flex'
            currentView = "lab"

            // Force resize after display flex
            requestAnimationFrame(() => {
                triggerLabResize()
            })
        })

        btnToggleSidebar.addEventListener('click', () => {
            sidebar.classList.toggle('open')
        })

        searchInput.addEventListener('input', (e) => {
            renderSidebar(e.target.value)
        })

        // ==========================================
        // Animation Loop
        // ==========================================
        const clock = new THREE.Clock()

        const tick = () => {
            const elapsedTime = clock.getElapsedTime()

            // Gentle center object rotation
            if (currentLessonId !== '04-transform-objects') {
                centerCube.rotation.y = elapsedTime * 0.4
                centerCube.rotation.x = elapsedTime * 0.2
            }

            if (currentView === "lab") {
                if (labControlMode === 'orbit') {
                    if (labControls.enabled) {
                        labControls.update()
                    }
                } else if (labControlMode === 'custom') {
                    const angle = cursor.x * Math.PI * 2
                    activeCam.position.x = Math.sin(angle) * 4.5
                    activeCam.position.z = Math.cos(angle) * 4.5
                    activeCam.position.y = cursor.y * 4
                    activeCam.lookAt(centerCube.position)
                } else if (labControlMode === 'lerp') {
                    const angle = cursor.x * Math.PI * 2
                    targetPos.x = Math.sin(angle) * 4.5
                    targetPos.z = Math.cos(angle) * 4.5
                    targetPos.y = cursor.y * 4
                    activeCam.position.lerp(targetPos, 0.05)
                    activeCam.lookAt(centerCube.position)
                }

                statCamPos.innerText = `x: ${activeCam.position.x.toFixed(1)}, y: ${activeCam.position.y.toFixed(1)}, z: ${activeCam.position.z.toFixed(1)}`
                labRenderer.render(labScene, activeCam)
            }

            window.requestAnimationFrame(tick)
        }

        // Initialize from URL Hash or default to Lesson 07 Cameras
        const initHash = window.location.hash.replace('#', '')
        if (initHash && LESSONS.some(l => l.id === initHash)) {
            currentLessonId = initHash
        } else {
            currentLessonId = "07-cameras"
        }

        renderSidebar()
        selectLesson(currentLessonId)
        triggerLabResize()
        tick()
    </script>
</body>
</html>
